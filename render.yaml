services:
  - type: keyvalue
    name: boju-boju-redis
    region: oregon
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: boju-boju-api
    runtime: python
    pythonVersion: "3.12"
    region: oregon
    plan: free
    rootDir: apps/api
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: boju-boju-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: boju-boju-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://boju-boju-web.onrender.com
      - key: WEB_BASE_URL
        value: https://boju-boju-web.onrender.com
      - key: API_BASE_URL
        value: https://boju-boju-api.onrender.com
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: REFRESH_COOKIE_SAMESITE
        value: "none"

  - type: web
    name: boju-boju-web
    runtime: static
    buildCommand: cd apps/web && npm install && npm run build
    staticPublishPath: apps/web/dist
    branch: main
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: sameorigin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: VITE_API_BASE_URL
        value: https://boju-boju-api.onrender.com

databases:
  - name: boju-boju-db
    region: oregon
    plan: free
    databaseName: bojuboju
    user: bojuboju
    ipAllowList: []
